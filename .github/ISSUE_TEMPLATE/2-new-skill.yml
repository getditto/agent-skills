name: Propose a new skill
description: Suggest a skill that fills a gap where agents currently get Ditto wrong.
title: "[Skill] "
labels: ["new-skill", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **Proposals are accepted when the skill fills a demonstrated gap.**
        > Before opening this, try the task against a current model with **no Ditto skill
        > loaded** and keep the transcript. Ideally check both a fast model and a
        > reasoning model — a gap that only a small model has is usually not worth a skill.

        Every skill's name and description are injected into **every** agent session, so an
        unnecessary skill costs context for everyone. "The model already handles this well"
        is a good reason not to add one, and a perfectly good outcome for this issue.

  - type: textarea
    id: gap
    attributes:
      label: What do agents get wrong today?
      description: |
        The specific failure, not the topic area. What did you ask, and what came back
        that was wrong or unusable?
      placeholder: |
        Asked for a DQL query joining orders to customers on 5.1. The model produced
        SQL-style syntax Ditto rejects, and invented a FULL OUTER JOIN that DQL has no
        support for on any version.
    validations:
      required: true

  - type: textarea
    id: transcript
    attributes:
      label: Evidence of the gap
      description: |
        The prompt you used and what the model returned. Paste the actual output.
      render: markdown
    validations:
      required: true

  - type: input
    id: models
    attributes:
      label: Which models did you test?
      description: Name and version. Testing more than one tier makes the case much stronger.
      placeholder: "Claude Opus 4.5 and Haiku 4.5; also GPT-5.1"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should the skill cover?
      description: |
        Scope it. What questions should it answer, and — just as important — what should
        it deliberately stay out of, so it doesn't fire on unrelated topics?
    validations:
      required: true

  - type: checkboxes
    id: overlap
    attributes:
      label: Overlap check
      description: Skills that duplicate each other compete for the same triggers and both get worse.
      options:
        - label: I checked the existing skills in `skills/` and this isn't already covered
          required: true
        - label: This is better as a new skill than as a section added to an existing one
          required: true

  - type: input
    id: versions
    attributes:
      label: Which SDK versions would it need to cover?
      description: The repo currently documents 4.14.x (LTS), 5.0.x and 5.1.x.
      placeholder: "All three; behaviour differs on 4.14.x"
    validations:
      required: false

  - type: textarea
    id: testability
    attributes:
      label: Could it be tested automatically?
      description: |
        Optional. If the skill would document runnable statements, they can be verified by
        a harness like `tests/dql/`. If it's conceptual (mesh behaviour, sync semantics),
        say so — that's fine, it just changes how we review it.
    validations:
      required: false

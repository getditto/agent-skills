version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories:
      - "/tests/dql/sdks/v4.14.6"
      - "/tests/dql/sdks/v5.0.3"
      - "/tests/dql/sdks/v5.1.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    versioning-strategy: lockfile-only
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directories:
      - "/tests/kotlin-sdk/minimal-app"
      - "/tests/kotlin-sdk/android-app"
    # Newer Jackson lines need API 26; the historical Android fixture targets 24.
    # Continue accepting security/patch fixes on the verified 2.18 line.
    ignore:
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      gradle-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pub"
    directories:
      - "/tests/flutter-sdk/minimal_app"
      - "/tests/flutter-sdk/snippet_check"
      - "/tests/flutter-sdk/v4_app"
    # tests/flutter-sdk/versions.json owns the ditto_live pin per SDK line and the
    # flutter_lints pin every fixture must match (test_fixture_scripts.py), so bump
    # those there and in the pubspecs together, not through Dependabot.
    ignore:
      - dependency-name: "ditto_live"
      - dependency-name: "flutter_lints"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      pub-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      pub-security:
        applies-to: security-updates
        patterns: ["*"]

name: Flutter SDK Skill Tests

on:
  pull_request:
    paths:
      - 'skills/flutter-sdk/**'
      - 'tests/flutter-sdk/**'
      - '.github/workflows/flutter-skill-tests.yml'
  push:
    branches: [main]
    paths:
      - 'skills/flutter-sdk/**'
      - 'tests/flutter-sdk/**'
      - '.github/workflows/flutter-skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-skill-tests-${{ github.ref }}
  cancel-in-progress: true

# License hygiene, for every job below:
# - The license reaches Flutter only through run-fixture.sh's (or web-probe.py's, or
#   run-macos-release.sh's) mode-600 --dart-define-from-file file, never an argument.
# - Compiled builds embed every define, so nothing here caches or uploads build/,
#   the fixture copies under the temp directory, or .dart_tool, and no job uploads
#   artifacts. Logs stay in the job output, where the scripts redact the license.
# - Dependabot-triggered runs read Dependabot secrets, not Actions secrets.

env:
  FLUTTER: flutter
  PYTHON: python3

jobs:
  macos:
    name: macOS probes against ditto_live ${{ matrix.line }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        line: ['5.0', '5.1', '5.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      # run-fixture.sh bounds each flutter run with GNU timeout (gtimeout here).
      - name: Install GNU coreutils
        run: brew install coreutils
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      # init_once first, alone: nothing may call Ditto.init() before it.
      - name: Run the minimal app and the probes
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          LINE: ${{ matrix.line }}
        run: |
          case "$LINE" in
            5.0) dirs=(v50) ;;
            5.1) dirs=(v50 v51) ;;
            5.2) dirs=(v50 v51 v52) ;;
          esac
          targets=(integration_test/probes/init_once integration_test/minimal_app_test.dart)
          for dir in "${dirs[@]}"; do targets+=("integration_test/probes/$dir"); done
          tests/flutter-sdk/scripts/run-fixture.sh minimal_app macos "$LINE" "${targets[@]}"

  macos-release:
    name: macOS release build runs ditto_live 5.2
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      # Release.entitlements, not DebugProfile.entitlements. The .app embeds the
      # license; the script deletes the build output and nothing uploads it.
      - name: Build in release mode, run the .app and check its transcript
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: tests/flutter-sdk/scripts/run-macos-release.sh 5.2

  migration:
    name: 5.1 to 5.2 default-directory migration (macOS, iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      # run-fixture.sh bounds each flutter run with GNU timeout (gtimeout here).
      - name: Install GNU coreutils
        run: brew install coreutils
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      # Its own job: nothing else on this runner opens the default directory first.
      - name: Migrate on macOS (wipe, write on 5.1, read on 5.2)
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: tests/flutter-sdk/scripts/run-migration.sh macos
      - name: Boot an iOS Simulator
        id: sim
        run: echo "udid=$(tests/flutter-sdk/scripts/boot-simulator.sh)" >> "$GITHUB_OUTPUT"
      # Same bundle ID, and run-fixture.sh keeps the app installed between phases.
      - name: Migrate on the iOS Simulator (wipe, write on 5.1, read on 5.2)
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_PLATFORM: ios
          # A first run on a fresh simulator can hang waiting for the debug
          # connection; a target the timeout stops is run once more.
          FIXTURE_TIMEOUT: '600'
          FIXTURE_RETRIES: '1'
        run: tests/flutter-sdk/scripts/run-migration.sh "${{ steps.sim.outputs.udid }}"
      - name: Show the simulator's Runner log
        if: failure()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 30m --style compact \
            --predicate 'process == "Runner"' | tail -300

  ios-sim:
    name: iOS Simulator against ditto_live 5.2
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      # run-fixture.sh bounds each flutter run with GNU timeout (gtimeout here).
      - name: Install GNU coreutils
        run: brew install coreutils
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      - name: Boot an iOS Simulator
        id: sim
        run: echo "udid=$(tests/flutter-sdk/scripts/boot-simulator.sh)" >> "$GITHUB_OUTPUT"
      # A simulator UDID carries no platform, so DITTO_PLATFORM is set.
      - name: Run the minimal app and the store and observer probes
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_PLATFORM: ios
          # A first run on a fresh simulator can hang waiting for the debug
          # connection; a target the timeout stops is run once more.
          FIXTURE_TIMEOUT: '600'
          FIXTURE_RETRIES: '1'
        run: |
          tests/flutter-sdk/scripts/run-fixture.sh minimal_app "${{ steps.sim.outputs.udid }}" 5.2 \
            integration_test/minimal_app_test.dart \
            integration_test/probes/v50/store_test.dart \
            integration_test/probes/v50/observers_test.dart
      - name: Show the simulator's Runner log
        if: failure()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 30m --style compact \
            --predicate 'process == "Runner"' | tail -300

  android-emulator:
    name: Android emulator against ditto_live 5.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # emulator-5554 maps to DITTO_PLATFORM=android in run-fixture.sh.
      - name: Run the minimal app and the store and observer probes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/flutter-sdk/scripts/run-fixture.sh minimal_app emulator-5554 5.2 integration_test/minimal_app_test.dart integration_test/probes/v50/store_test.dart integration_test/probes/v50/observers_test.dart

  android-release:
    name: Android release APK, ditto_live ${{ matrix.line }} (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '4.14'
            fixture: v4_app
          - line: '5.0'
            fixture: minimal_app
          - line: '5.1'
            fixture: minimal_app
          - line: '5.2'
            fixture: minimal_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      # No license define: this leg builds only, so the APK embeds no license.
      # Release signing uses the debug keys (android/app/build.gradle.kts), and R8
      # shrinks against Ditto's classes.
      - name: Build the release APK
        id: build
        env:
          FIXTURE: ${{ matrix.fixture }}
          LINE: ${{ matrix.line }}
        run: |
          workdir="$(python3 tests/flutter-sdk/scripts/use-version.py "$FIXTURE" "$LINE" | tail -1)"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          cd "$workdir"
          if ! flutter build apk --release; then
            # ditto_live 4.14.7 downloads ditto.jar while Gradle configures, so the
            # first build after `pub get` fails: "Transform's input file does not
            # exist: .../ditto_live-4.14.7/android/libs/ditto.jar" (README, SDK
            # defects). Only that line gets one retry.
            [[ "$LINE" == "4.14" ]] || exit 1
            echo '::warning::ditto_live 4.14.7 first-build failure; retrying once (SDK defect in tests/flutter-sdk/README.md)'
            flutter build apk --release
          fi
      # ditto_live's own library manifest declares these on every line, so assert
      # the MERGED release manifest of the APK (aapt2), not the fixture's source
      # manifest: release builds lose permissions that only debug manifests have.
      - name: Assert the merged release manifest's permissions
        env:
          WORKDIR: ${{ steps.build.outputs.workdir }}
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 | sort -V | tail -1)"
          "$aapt2" dump permissions "$WORKDIR/build/app/outputs/flutter-apk/app-release.apk" | tee permissions.txt
          for permission in INTERNET BLUETOOTH_SCAN BLUETOOTH_ADVERTISE BLUETOOTH_CONNECT \
            ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION NEARBY_WIFI_DEVICES ACCESS_WIFI_STATE; do
            grep -q "name='android.permission.$permission'" permissions.txt \
              || { echo "::error::android.permission.$permission is missing from the merged release manifest"; exit 1; }
          done

  ios-build:
    name: iOS Simulator build, ditto_live ${{ matrix.line }} (${{ matrix.fixture }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '4.14'
            fixture: v4_app
          - line: '5.2'
            fixture: minimal_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      # Builds only, no license define. The Podfile post_install excludes x86_64
      # from the Runner's simulator builds (ditto_live 5.1+ ships arm64 only).
      - name: Build for the iOS Simulator
        env:
          FIXTURE: ${{ matrix.fixture }}
          LINE: ${{ matrix.line }}
        run: |
          cd "$(python3 tests/flutter-sdk/scripts/use-version.py "$FIXTURE" "$LINE" | tail -1)"
          flutter build ios --simulator --no-codesign

  linux:
    name: Linux desktop against ditto_live 5.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Run the minimal app and the probes
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          xvfb-run -a tests/flutter-sdk/scripts/run-fixture.sh minimal_app linux 5.2 \
            integration_test/probes/init_once integration_test/minimal_app_test.dart \
            integration_test/probes/v50 integration_test/probes/v51 integration_test/probes/v52

  windows:
    name: Windows desktop against ditto_live 5.2
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      # run-fixture.sh through Git Bash, `flutter test -d windows`.
      - name: Run the minimal app and the probes
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          tests/flutter-sdk/scripts/run-fixture.sh minimal_app windows 5.2 \
            integration_test/probes/init_once integration_test/minimal_app_test.dart \
            integration_test/probes/v50 integration_test/probes/v51 integration_test/probes/v52
      # On Windows the harness leaves a persistence directory that is still locked
      # after close() and prints a `cleanup:` line (README, Windows desktop).
      - name: Report persistence directories still locked after close
        if: always()
        run: |
          grep -h 'cleanup: still locked after close' tests/flutter-sdk/run-minimal_app-windows-5.2-*.log \
            | sed 's/^/::warning::/' || echo 'no locked directories reported'

  web:
    name: Flutter Web (Chrome) against ditto_live ${{ matrix.line }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        line: ['5.1', '5.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      # The runner image's ChromeDriver matches its Chrome. run-fixture.sh starts it
      # on :4444 and checks /status; web-probe.py starts its own on a free port.
      - name: Drive the web probes (debug, flutter drive)
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          LINE: ${{ matrix.line }}
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          google-chrome --version
          "$CHROMEDRIVER" --version
          tests/flutter-sdk/scripts/run-fixture.sh minimal_app chrome "$LINE" \
            integration_test/web/web_all_test.dart integration_test/web/web_51_test.dart \
            integration_test/web/web_license_test.dart
      - name: Run the release build-mode and hosting probes
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          LINE: ${{ matrix.line }}
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          python3 tests/flutter-sdk/scripts/web-probe.py --line "$LINE" --skip-manual

  v4:
    name: v4_app on macOS against ditto_live 4.14
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      # run-fixture.sh bounds each flutter run with GNU timeout (gtimeout here).
      - name: Install GNU coreutils
        run: brew install coreutils
      - name: Check the offline license is configured
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [[ -z "$DITTO_OFFLINE_LICENSE" ]]; then
            echo '::error::Set DITTO_OFFLINE_LICENSE in Actions secrets and Dependabot secrets before running the Flutter fixtures.'
            exit 1
          fi
      - name: Run the v4 open, write and read-back test
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: tests/flutter-sdk/scripts/run-fixture.sh v4_app macos 4.14 integration_test/v4_test.dart

  # The skill ships generated copies of marked regions of the fixtures. Rebuild the
  # minimal app from the skill's Markdown alone, so a copy that matches its source
  # but does not build on its own fails. Builds only, no license define.
  from-skill:
    name: Build the minimal app from the skill's Markdown (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-24.04
          - target: ios
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        run: echo "flutter=$(jq -er .flutter tests/flutter-sdk/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.pins.outputs.flutter }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Assemble the project, resolve, and age-check the lock
        run: |
          python3 tests/flutter-sdk/build-from-skill.py "$RUNNER_TEMP/from-skill"
          (cd "$RUNNER_TEMP/from-skill" && flutter pub get)
          python3 - "$RUNNER_TEMP/from-skill/pubspec.lock" <<'EOF'
          import importlib.util, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("age", "scripts/check-dependency-age.py")
          age = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(age)
          age.pub_check(Path(sys.argv[1]), datetime.now(timezone.utc) - timedelta(days=3))
          print("pub lock age OK:", sys.argv[1])
          EOF
      - name: Analyze and build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP/from-skill"
          flutter analyze
          if [[ "$TARGET" == apk ]]; then
            flutter build apk --debug
          else
            flutter build ios --simulator --debug --no-codesign
          fi

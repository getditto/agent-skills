name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * 1'

permissions:
  contents: read

jobs:
  pins-and-npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Test release-age boundaries and pin validation
        run: python3 -m unittest discover -s tests/dependencies -v
      - name: Enforce 72-hour maturity, including security updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-dependency-age.py
      - name: Audit every committed npm lockfile without installing dependencies
        shell: bash
        run: |
          while IFS= read -r -d '' lockfile; do
            npm audit --prefix "$(dirname "$lockfile")" --package-lock-only
          done < <(git ls-files -z -- '**/package-lock.json' 'package-lock.json')
      - name: Audit the committed MCP bridge snapshot and its transitives
        run: python3 scripts/audit-mcp-dependencies.py

  maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test inventory failure and compiler/processor coverage offline
        env:
          RUN_GRADLE_INVENTORY_TESTS: '1'
        run: |
          tests/kotlin-sdk/minimal-app/gradlew --version
          python3 -m unittest discover -s tests/dependencies -p 'test_maven_inventory.py' -v
      - name: Resolve every supported JVM and Android dependency graph
        shell: bash
        run: |
          repository="$PWD"
          for sdk in 5.0.3 5.1.0 5.2.0; do
            (cd tests/kotlin-sdk/minimal-app &&
              DEPENDENCY_AUDIT_OUTPUT="$RUNNER_TEMP/dependencies-jvm-$sdk.json" \
              ./gradlew dependencyInventory -I "$repository/scripts/dependency-inventory.gradle" \
                -PdittoVersion="$sdk" --console=plain)
          done
          for sdk in 4.14.7 5.0.3 5.1.0 5.2.0; do
            line=v5
            [[ "$sdk" == 4.* ]] && line=v4
            (cd tests/kotlin-sdk/android-app &&
              DEPENDENCY_AUDIT_OUTPUT="$RUNNER_TEMP/dependencies-android-$sdk.json" \
              ./gradlew dependencyInventory -I "$repository/scripts/dependency-inventory.gradle" \
                -PdittoLine="$line" -PdittoVersion="$sdk" --console=plain)
          done
      - name: Check all resolved Maven versions against release ages and OSV
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          arguments=()
          for inventory in "$RUNNER_TEMP"/dependencies-*.json; do
            arguments+=(--maven-inventory "$inventory")
          done
          python3 scripts/check-dependency-age.py "${arguments[@]}"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          echo "Validating marketplace.json..."
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

          echo "Validating plugin.json files..."
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "  Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

          echo "All JSON files valid"

      - name: Validate SKILL.md frontmatter
        run: |
          echo "Validating SKILL.md files..."
          for f in skills/*/SKILL.md; do
            echo "  Checking $f"
            # Check file starts with ---
            if ! head -1 "$f" | grep -q "^---$"; then
              echo "ERROR: $f missing YAML frontmatter"
              exit 1
            fi
            # Check frontmatter has required fields
            if ! grep -q "^name:" "$f"; then
              echo "ERROR: $f missing 'name' in frontmatter"
              exit 1
            fi
            if ! grep -q "^description:" "$f"; then
              echo "ERROR: $f missing 'description' in frontmatter"
              exit 1
            fi
          done

          echo "All SKILL.md files valid"

      - name: Check plugin references in marketplace
        run: |
          echo "Checking plugin sources exist..."
          python3 << 'EOF'
          import json
          import os
          import sys

          with open('.claude-plugin/marketplace.json') as f:
              marketplace = json.load(f)

          errors = []
          for plugin in marketplace.get('plugins', []):
              source = plugin.get('source', '')
              plugin_json = os.path.join(source, '.claude-plugin/plugin.json')
              if not os.path.exists(plugin_json):
                  errors.append(f"Plugin '{plugin['name']}' source not found: {plugin_json}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print("All plugin references valid")
          EOF

      - name: Check plugin wrappers are scoped
        run: |
          echo "Checking each plugin only ships its own skills/agents..."
          python3 << 'EOF'
          import os
          import sys

          errors = []

          for plugin in sorted(os.listdir('plugins')):
              root = os.path.join('plugins', plugin)
              if not os.path.isdir(root):
                  continue

              for kind, canonical, suffix in (
                  ('skills', 'skills', 'SKILL.md'),
                  ('agents', 'agents', None),
              ):
                  wrapper = os.path.join(root, kind)
                  # lexists, not exists: a broken symlink here must be reported,
                  # not silently skipped.
                  if not os.path.lexists(wrapper):
                      continue

                  # A symlinked wrapper dir points at the whole canonical tree,
                  # which silently ships every skill in the repo. Each entry must
                  # be linked individually instead.
                  if os.path.islink(wrapper):
                      errors.append(
                          f"{wrapper} is a symlink to the whole {canonical}/ tree; "
                          f"link each {kind[:-1]} individually so the plugin only "
                          f"ships what it declares"
                      )
                      continue

                  entries = [e for e in sorted(os.listdir(wrapper))
                             if not e.startswith('.')]
                  if not entries:
                      errors.append(f"{wrapper} is empty")

                  for entry in entries:
                      path = os.path.join(wrapper, entry)
                      target = os.path.realpath(path)
                      expected_root = os.path.realpath(canonical)

                      if os.path.commonpath([target, expected_root]) != expected_root:
                          errors.append(
                              f"{path} resolves outside {canonical}/: {target}"
                          )
                          continue
                      if not os.path.exists(target):
                          errors.append(f"{path} is a broken symlink")
                          continue
                      if suffix and not os.path.exists(os.path.join(target, suffix)):
                          errors.append(f"{path} has no {suffix}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print("All plugin wrappers are correctly scoped")
          EOF

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-portability:
    name: SDK packaging on ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the 3.9 floor check on Linux; Windows has no 3.9.25 runtime build.
        # The supported interpreter also verifies current packaging on both platforms.
        include:
          - os: ubuntu-24.04
            python: '3.9.25'
          - os: ubuntu-24.04
            python: '3.14.10'
          - os: windows-latest
            python: '3.14.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check portable installation archives
        run: python -m unittest discover -s tests/swift-sdk -p test_packaging.py -v

  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON files
        run: |
          echo "Validating marketplace.json..."
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

          echo "Validating plugin.json files..."
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "  Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

          echo "All JSON files valid"

      - name: Validate SKILL.md frontmatter
        run: |
          echo "Validating SKILL.md files..."
          for f in skills/*/SKILL.md; do
            echo "  Checking $f"
            # Check file starts with ---
            if ! head -1 "$f" | grep -q "^---$"; then
              echo "ERROR: $f missing YAML frontmatter"
              exit 1
            fi
            # Check frontmatter has required fields
            if ! grep -q "^name:" "$f"; then
              echo "ERROR: $f missing 'name' in frontmatter"
              exit 1
            fi
            if ! grep -q "^description:" "$f"; then
              echo "ERROR: $f missing 'description' in frontmatter"
              exit 1
            fi
          done

          echo "All SKILL.md files valid"

      - name: Check skill context guard negative controls
        run: python3 tests/skill-context/test_contract.py

      - name: Check Swift runner regressions
        run: python3 tests/swift-sdk/test_runner.py

      - name: Check latest stable SDK selection
        run: python3 tests/swift-sdk/test_version_selection.py

      - name: Check Swift package integrity and failure controls
        run: python3 -m unittest discover -s tests/swift-sdk -p test_packaging.py -v

      - name: Check Swift host metadata and build standalone packages
        run: |
          python3 scripts/package-sdk-plugin.py --check
          python3 scripts/package-sdk-plugin.py --output "$RUNNER_TEMP/ditto-swift-packages"

      - name: Upload Swift installation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ditto-swift-installation-packages
          path: |
            ${{ runner.temp }}/ditto-swift-packages/*.zip
            ${{ runner.temp }}/ditto-swift-packages/SHA256SUMS

      - name: Check Kotlin host metadata and build standalone packages
        run: |
          python3 scripts/package-sdk-plugin.py --plugin ditto-kotlin --check
          python3 scripts/package-sdk-plugin.py --plugin ditto-kotlin --output "$RUNNER_TEMP/ditto-kotlin-packages"

      - name: Upload Kotlin installation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ditto-kotlin-installation-packages
          path: |
            ${{ runner.temp }}/ditto-kotlin-packages/*.zip
            ${{ runner.temp }}/ditto-kotlin-packages/SHA256SUMS

      - name: Check CSharp generators, template synchronization and packages
        run: |
          python3 -m unittest discover -s tests/csharp-sdk -p 'test_*.py' -v
          python3 scripts/package-sdk-plugin.py --plugin ditto-csharp --check
          python3 scripts/package-sdk-plugin.py --plugin ditto-csharp --output "$RUNNER_TEMP/ditto-csharp-packages"

      - name: Upload CSharp installation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ditto-csharp-installation-packages
          path: |
            ${{ runner.temp }}/ditto-csharp-packages/*.zip
            ${{ runner.temp }}/ditto-csharp-packages/SHA256SUMS

      - name: Check plugin references in marketplace
        run: |
          echo "Checking plugin sources exist..."
          python3 << 'EOF'
          import json
          import os
          import sys

          with open('.claude-plugin/marketplace.json') as f:
              marketplace = json.load(f)

          errors = []
          for plugin in marketplace.get('plugins', []):
              source = plugin.get('source', '')
              plugin_json = os.path.join(source, '.claude-plugin/plugin.json')
              if not os.path.exists(plugin_json):
                  errors.append(f"Plugin '{plugin['name']}' source not found: {plugin_json}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print("All plugin references valid")
          EOF


      - name: Check plugin wrappers are scoped
        run: |
          echo "Checking each plugin only ships what it declares..."
          python3 << 'EOF'
          import os
          import sys

          KINDS = (('skills', 'SKILL.md'), ('agents', None))

          errors = []
          shipped = {kind: set() for kind, _ in KINDS}

          if not os.path.isdir('plugins'):
              print("ERROR: no plugins/ directory (run from the repo root)")
              sys.exit(1)

          def check_target(path, target, root, canonical):
              """Target must be a strict descendant of the canonical tree."""
              if not os.path.exists(target):
                  errors.append(f"{path} is a broken symlink")
                  return None
              if target == root:
                  errors.append(
                      f"{path} points at the whole {canonical}/ tree; a plugin must "
                      f"link only the items it ships"
                  )
                  return None
              if os.path.commonpath([target, root]) != root:
                  errors.append(f"{path} resolves outside {canonical}/: {target}")
                  return None
              return target

          for plugin in sorted(os.listdir('plugins')):
              proot = os.path.join('plugins', plugin)
              if not os.path.isdir(proot):
                  continue

              ships_anything = False

              for canonical, suffix in KINDS:
                  wrapper = os.path.join(proot, canonical)
                  # lexists, not exists: a broken symlink must be reported, not skipped.
                  if not os.path.lexists(wrapper):
                      continue

                  root = os.path.realpath(canonical)

                  # Shape (a): the wrapper itself is a symlink to a scoped
                  # subdirectory of the canonical tree, e.g.
                  #   plugins/ditto-dql/agents -> ../../agents/ditto-dql
                  # Claude Code follows a symlinked *directory* but not a
                  # symlinked *file*, so agents must use this shape.
                  if os.path.islink(wrapper):
                      target = check_target(wrapper, os.path.realpath(wrapper), root, canonical)
                      if target:
                          entries = [e for e in os.listdir(target) if not e.startswith('.')]
                          if not entries:
                              errors.append(f"{wrapper} -> {target} is empty")
                          else:
                              ships_anything = True
                              shipped[canonical].add(os.path.basename(target))
                      continue

                  # Shape (b): a real directory whose entries are symlinks into
                  # the canonical tree, e.g.
                  #   plugins/ditto-dql/skills/write-dql -> ../../../skills/write-dql
                  entries = [e for e in sorted(os.listdir(wrapper)) if not e.startswith('.')]
                  if not entries:
                      errors.append(f"{wrapper} is empty")
                      continue

                  for entry in entries:
                      path = os.path.join(wrapper, entry)
                      if not os.path.islink(path):
                          errors.append(
                              f"{path} is a copy, not a symlink into {canonical}/; "
                              f"skill and agent content must live once, in {canonical}/"
                          )
                          continue
                      target = check_target(path, os.path.realpath(path), root, canonical)
                      if not target:
                          continue
                      if suffix and not os.path.isfile(os.path.join(target, suffix)):
                          errors.append(f"{path} has no {suffix}")
                          continue
                      if suffix and entry != os.path.basename(target):
                          errors.append(
                              f"{path} must use the canonical skill directory name "
                              f"'{os.path.basename(target)}' for portable discovery"
                          )
                          continue
                      ships_anything = True
                      shipped[canonical].add(os.path.basename(target))

              if not ships_anything:
                  errors.append(f"plugins/{plugin} ships no skills or agents")

          # Every canonical skill must be installable through some plugin,
          # otherwise it is unreachable for users and the README goes stale.
          if os.path.isdir('skills'):
              orphans = {d for d in os.listdir('skills')
                         if os.path.isfile(os.path.join('skills', d, 'SKILL.md'))} - shipped['skills']
              for o in sorted(orphans):
                  errors.append(f"skills/{o} is shipped by no plugin; add a wrapper for it")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print("All plugin wrappers are correctly scoped")
          EOF

      - name: Validate SDK skill structure
        run: python3 scripts/validate-sdk-skills.py

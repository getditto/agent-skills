name: CSharp SDK Skill Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/csharp-sdk/**'
      - 'tests/csharp-sdk/**'
      - '.github/workflows/csharp-skill-tests.yml'
  push:
    branches: [main]
    paths:
      - 'skills/csharp-sdk/**'
      - 'tests/csharp-sdk/**'
      - '.github/workflows/csharp-skill-tests.yml'

permissions:
  contents: read

jobs:
  core:
    name: Ditto ${{ matrix.sdk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        sdk: ['4.14.7', '5.0.4', '5.1.0', '5.2.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.102
            8.0.x
      - name: Run real native SDK tests
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_DATABASE_ID: ${{ vars.DITTO_DATABASE_ID }}
        run: python tests/csharp-sdk/scripts/run.py ${{ matrix.sdk }}
      - name: Verify .NET 8 and the published minimal program
        if: matrix.sdk == '5.2.0'
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_DATABASE_ID: ${{ vars.DITTO_DATABASE_ID }}
        run: |
          python tests/csharp-sdk/scripts/run.py 5.2.0 --framework net8.0
          python tests/csharp-sdk/scripts/verify-minimal.py

  desktop:
    name: Generated apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: desktop
          - os: macos-26
            platform: desktop
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.102
      - name: Generate, compile, publish and run
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_DATABASE_ID: ${{ vars.DITTO_DATABASE_ID }}
        run: python tests/csharp-sdk/scripts/verify-starters.py --platform ${{ matrix.platform }} --runtime
      - name: Verify installed standalone skill archive
        if: runner.os == 'Linux'
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_DATABASE_ID: ${{ vars.DITTO_DATABASE_ID }}
        run: python tests/csharp-sdk/scripts/verify-package.py
      - name: Build and execute .NET Framework 4.8 native smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
          DITTO_DATABASE_ID: ${{ vars.DITTO_DATABASE_ID }}
        run: |
          dotnet build tests/csharp-sdk/LegacySmoke -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem tests/csharp-sdk/LegacySmoke/bin/Release -Filter LegacySmoke.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Missing net48 executable' }
          & $exe.FullName
          exit $LASTEXITCODE

  mobile:
    name: MAUI ${{ matrix.target }} build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
            workload: maui-android
            arguments: --platform android
          - os: macos-26
            target: ios
            workload: maui-ios
            arguments: --platform apple --apple-target ios
          - os: macos-26
            target: maccatalyst
            workload: maui-maccatalyst
            arguments: --platform apple --apple-target maccatalyst
          - os: windows-latest
            target: windows
            workload: maui-windows
            arguments: --platform maui-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.102
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      # Workload set 10.0.102 uses Apple SDK 26.2. Never bypass Xcode validation.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      - name: Select matching Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install pinned workload set
        run: dotnet workload install ${{ matrix.workload }} --version 10.0.102
      - name: Build the generated native app
        run: python tests/csharp-sdk/scripts/verify-starters.py ${{ matrix.arguments }}

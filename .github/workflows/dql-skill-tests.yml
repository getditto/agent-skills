name: DQL Skill Tests

on:
  pull_request:
    paths:
      - 'skills/write-dql/**'
      - 'tests/dql/**'
      - 'tests/skill-context/check-scoped-joins.mjs'
      - 'skills/data-modeling/examples/order-management.md'
      - 'skills/data-modeling/examples/relational-migration.md'
      - '.github/workflows/dql-skill-tests.yml'
  push:
    branches: [main]
    paths:
      - 'skills/write-dql/**'
      - 'tests/dql/**'
      - 'tests/skill-context/check-scoped-joins.mjs'
      - 'skills/data-modeling/examples/order-management.md'
      - 'skills/data-modeling/examples/relational-migration.md'
      - '.github/workflows/dql-skill-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test against Ditto SDK ${{ matrix.sdk }}
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sdk: ['4.14.6', '5.0.3', '5.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Install SDK
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        working-directory: tests/dql
        run: |
          cd "sdks/v${SDK_VERSION}"
          npm ci

      - name: Verify transformed fixture exists
        working-directory: tests/dql
        run: |
          if [ ! -f fixtures/movies-pedagogical.ndjson ]; then
            echo "fixtures/movies-pedagogical.ndjson not found — the committed fixture is required"
            exit 1
          fi
          wc -l fixtures/movies-pedagogical.ndjson

      - name: Run tests
        working-directory: tests/dql
        env:
          SDK_VERSION: ${{ matrix.sdk }}
          DITTO_SDK_VERSION: ${{ matrix.sdk }}
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: |
          if [ "$SDK_VERSION" = "4.14.6" ]; then
            npm run test:v4
          elif [ "$SDK_VERSION" = "5.1.0" ]; then
            npm run test:v51
          else
            npm run test:v5
          fi

      - name: Verify scoped JOIN examples
        if: matrix.sdk == '5.1.0'
        env:
          DITTO_OFFLINE_LICENSE: ${{ secrets.DITTO_OFFLINE_LICENSE }}
        run: env -u NO_COLOR node tests/skill-context/check-scoped-joins.mjs

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dql-test-results-${{ matrix.sdk }}
          path: tests/dql/results/

  summary:
    name: Combined report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: tests/dql/results-merged
      - name: Merge artifacts into single results dir
        run: |
          mkdir -p tests/dql/results
          for d in tests/dql/results-merged/*/; do
            cp -r "$d"* tests/dql/results/ 2>/dev/null || true
          done
          ls tests/dql/results/
      - name: Print report
        working-directory: tests/dql
        continue-on-error: true
        run: node scripts/report.mjs || true

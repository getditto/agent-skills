name: minimal_app
description: Minimal Ditto Flutter app; the program published in skills/flutter-sdk/examples/minimal-app.md.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# snippet:start flutter-minimal-pubspec
dependencies:
  flutter:
    sdk: flutter
  # The version this example was tested with. In a new app, run
  # `flutter pub add ditto_live` to get the latest stable release.
  ditto_live: 5.2.0
# snippet:end flutter-minimal-pubspec

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # integration_test/migration only: the Documents and Application Support
  # directories the 5.1 and 5.2 default persistence directories live in.
  path_provider: 2.1.6
